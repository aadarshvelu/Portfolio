<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FILE NO. 001</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0d1a2f;
    --ink-deep:#070f1c;
    --paper:#e9e2d0;        /* warm off-white film title color */
    --paper-dim:#b9b3a3;
    --amber:#d8c39a;
    --glow:#9fb6d8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- The "screen" : large rounded film frame ---------- */
  #frame{
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 90% at 50% 38%, #122a4a 0%, transparent 60%),
      radial-gradient(140% 120% at 50% 50%, #14233f 0%, var(--ink) 45%, var(--ink-deep) 100%);
    overflow:hidden;
    border-radius:28px;
    box-shadow:
      inset 0 0 200px rgba(0,0,0,.9),
      inset 0 0 60px rgba(0,0,0,.7);
  }
  @media (min-width:700px){
    body{ background:#000; }
    #frame{
      inset:18px;
      border-radius:34px;
    }
  }

  canvas#sky{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  /* ---------- Stage that holds all the title cards ---------- */
  #stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vw;
    z-index:5;
    pointer-events:none;
  }

  .card{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(1100px,92vw);
    opacity:0;
    will-change:opacity, transform, filter;
  }

  /* ---------- Scene 1: typewriter file labels ---------- */
  .label{
    font-family:"JetBrains Mono", ui-monospace, "Courier New", monospace;
    font-weight:300;
    color:var(--paper-dim);
    letter-spacing:.55em;
    text-transform:uppercase;
    line-height:2.4;
  }
  .label .line{
    display:block;
    opacity:0;
    filter:blur(6px);
    transform:translateY(8px);
  }
  .label .line.show{
    animation:lineIn 1.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .label .line.out{
    animation:lineOut 1.4s ease forwards;
  }
  .label .file{ font-size:clamp(11px,1.5vw,15px); color:var(--amber); opacity:.85; }
  .label .story{ font-size:clamp(13px,1.8vw,18px); }
  .label .big{
    font-size:clamp(18px,3vw,30px);
    color:var(--paper);
    letter-spacing:.42em;
  }

  @keyframes lineIn{
    0%{ opacity:0; filter:blur(7px); transform:translateY(10px); }
    100%{ opacity:1; filter:blur(0); transform:translateY(0); }
  }
  @keyframes lineOut{
    0%{ opacity:1; filter:blur(0); }
    100%{ opacity:0; filter:blur(8px); transform:translateY(-6px); }
  }

  /* blinking caret on typewriter */
  .caret{
    display:inline-block;
    width:.5em;
    margin-left:.15em;
    border-bottom:2px solid var(--amber);
    animation:blink 1s steps(1) infinite;
    transform:translateY(-.12em);
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- Scene 3 + 4 : identity (name + role stacked) ---------- */
  #identityCard{
    transition:transform 1.8s cubic-bezier(.2,.7,.2,1), opacity 1.8s ease;
  }
  #identityCard h1{
    font-family:"Oswald", "Arial Narrow", sans-serif;
    font-weight:700;
    color:var(--paper);
    font-size:clamp(46px,12vw,168px);
    line-height:.92;
    letter-spacing:.02em;
    text-transform:uppercase;
    opacity:0;
    filter:blur(10px);
    transform:translateY(14px);
    /* subtle chromatic aberration */
    text-shadow:
      -1.5px 0 rgba(255,40,80,.32),
       1.5px 0 rgba(40,180,255,.32),
       0 0 38px rgba(159,182,216,.28);
  }
  #identityCard h1.show{ animation:nameIn 2.4s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes nameIn{
    0%{ opacity:0; filter:blur(12px); transform:translateY(16px) scale(1.04); letter-spacing:.16em; }
    100%{ opacity:1; filter:blur(0); transform:translateY(0) scale(1); letter-spacing:.02em; }
  }
  #identityCard .surname{ color:var(--amber); }

  #roleP{
    margin-top:clamp(14px,2.4vw,26px);
    font-family:"Oswald", sans-serif;
    font-weight:300;
    color:var(--paper-dim);
    font-size:clamp(12px,2.1vw,21px);
    letter-spacing:.34em;
    text-transform:uppercase;
    opacity:0;
    filter:blur(6px);
    transform:translateY(8px);
  }
  #roleP.show{ animation:lineIn 1.8s cubic-bezier(.2,.7,.2,1) forwards; }
  #roleP .dot{ color:var(--amber); margin:0 .55em; opacity:.7; }

  /* shown / receded states (class-based so recede can override reveal) */
  #identityCard.reveal{ opacity:1; }
  /* lifted/dimmed state once the teaser stats take the stage */
  #identityCard.recede{
    transform:translate(-50%,-50%) translateY(-30vh) scale(.56);
    opacity:.26;
  }

  /* ---------- Scene 5: teaser stats (serif italic) ---------- */
  #teaserCard{ top:56%; }
  #teaserCard .stat{
    font-family:"Playfair Display", Georgia, serif;
    font-style:italic;
    font-weight:400;
    color:var(--paper);
    font-size:clamp(19px,4.2vw,46px);
    line-height:1.42;
    opacity:0;
    filter:blur(8px);
  }
  #teaserCard .stat .num{
    font-weight:500;
    color:var(--amber);
    font-style:italic;
  }
  #teaserCard .stat.show{
    animation:statIn 2s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes statIn{
    0%{ opacity:0; filter:blur(9px); transform:translateY(14px); letter-spacing:.12em; }
    100%{ opacity:.96; filter:blur(0); transform:translateY(0); letter-spacing:.01em; }
  }

  /* ---------- Final: scroll prompt ---------- */
  #scrollCard{ top:auto; bottom:6%; transform:translate(-50%,0); }
  #scrollCard .prompt{
    font-family:"JetBrains Mono", monospace;
    font-weight:300;
    color:var(--paper-dim);
    font-size:clamp(10px,1.4vw,13px);
    letter-spacing:.5em;
    text-transform:uppercase;
  }
  #scrollCard .arrow{
    display:block;
    margin:18px auto 0;
    width:1px; height:46px;
    background:linear-gradient(var(--paper-dim), transparent);
    position:relative;
    opacity:.6;
  }
  #scrollCard .arrow::after{
    content:"";
    position:absolute; left:50%; bottom:0;
    width:7px; height:7px;
    border-right:1px solid var(--paper-dim);
    border-bottom:1px solid var(--paper-dim);
    transform:translateX(-50%) rotate(45deg);
  }
  @keyframes nudge{
    0%,100%{ transform:translateY(0); opacity:.35; }
    50%{ transform:translateY(8px); opacity:.8; }
  }
  #scrollCard.show .arrow{ animation:nudge 2.4s ease-in-out infinite; }

  .show{ opacity:1 !important; }
  .fade{ transition:opacity 1.8s ease, filter 1.8s ease; }

  /* ---------- Overlays: scanlines, grain, vignette, aberration ---------- */
  .overlay{ position:absolute; inset:0; pointer-events:none; z-index:20; }

  /* CRT scanlines */
  #scanlines{
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:multiply;
    opacity:.55;
    z-index:21;
  }
  /* faint moving CRT bright bar */
  #crtSweep{
    background:linear-gradient(to bottom, transparent 0%, rgba(180,200,235,.05) 50%, transparent 100%);
    height:30%;
    animation:sweep 9s linear infinite;
    z-index:22;
  }
  @keyframes sweep{ 0%{ transform:translateY(-40%);} 100%{ transform:translateY(360%);} }

  /* film grain via SVG turbulence */
  #grain{
    z-index:23;
    opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:200px 200px;
    animation:grainShift .5s steps(4) infinite;
    mix-blend-mode:overlay;
  }
  @keyframes grainShift{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-4%,2%); }
    50%{ transform:translate(3%,-3%); }
    75%{ transform:translate(-2%,4%); }
    100%{ transform:translate(0,0); }
  }

  /* vignette + screen curvature darkening */
  #vignette{
    z-index:24;
    background:
      radial-gradient(120% 110% at 50% 45%, transparent 52%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.85) 100%);
  }

  /* chromatic aberration on the edges */
  #aberration{
    z-index:25;
    mix-blend-mode:screen;
    opacity:.5;
    background:
      radial-gradient(120% 110% at 49.6% 50%, transparent 70%, rgba(255,0,60,.10) 100%),
      radial-gradient(120% 110% at 50.4% 50%, transparent 70%, rgba(0,140,255,.10) 100%);
  }

  /* full-frame reel flicker */
  #flicker{ z-index:26; background:#000; opacity:0; }

  /* opening black -> fade in */
  #blackout{
    position:absolute; inset:0; background:#000; z-index:40; pointer-events:none;
    animation:bootFade 3s ease 0s forwards;
  }
  @keyframes bootFade{ 0%{opacity:1;} 100%{opacity:0;} }

  @media (prefers-reduced-motion:reduce){
    #crtSweep,#grain{ animation:none; }
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="sky"></canvas>

    <div id="stage">
      <!-- Scene 1 -->
      <div class="card label" id="labelCard">
        <span class="line file">FILE NO. 001</span>
        <span class="line story">THE STORY OF A</span>
        <span class="line big">SELF-TAUGHT ENGINEER</span>
        <span class="line story">WHO REFUSED TO WAIT</span>
        <span class="line story">FOR PERMISSION</span>
      </div>

      <!-- Scene 3 + 4 : identity (name stacked above role) -->
      <div class="card" id="identityCard">
        <h1 id="nameH">AADARSH<br><span class="surname">VELU</span></h1>
        <p id="roleP">Technical Lead<span class="dot">•</span>AI Builder<span class="dot">•</span>System Architect</p>
      </div>

      <!-- Scene 5 -->
      <div class="card" id="teaserCard">
        <div class="stat"><span class="num">50,000</span> résumés processed.</div>
        <div class="stat"><span class="num">Millions</span> of AI tokens.</div>
        <div class="stat">One continuous <span class="num">upgrade</span>.</div>
      </div>

      <!-- Final -->
      <div class="card" id="scrollCard">
        <div class="prompt">Scroll to begin the film</div>
        <span class="arrow"></span>
      </div>
    </div>

    <!-- overlays -->
    <div class="overlay" id="crtSweep"></div>
    <div class="overlay" id="scanlines"></div>
    <div class="overlay" id="grain"></div>
    <div class="overlay" id="aberration"></div>
    <div class="overlay" id="vignette"></div>
    <div class="overlay" id="flicker"></div>
    <div id="blackout"></div>
  </div>

<script>
/* =========================================================
   CINEMATIC CANVAS : stars, drifting particles, moon, fog
   ========================================================= */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildStars();
}
window.addEventListener('resize', resize);

/* --- starfield --- */
let stars = [];
function buildStars(){
  const count = Math.round((W*H)/9000);
  stars = [];
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.1 + 0.2,
      base: Math.random()*0.5 + 0.15,
      tw: Math.random()*Math.PI*2,
      tws: Math.random()*0.9 + 0.2,
      drift: Math.random()*0.02 + 0.004
    });
  }
}

/* --- drifting dust particles (foreground) --- */
let dust = [];
function buildDust(){
  dust = [];
  const n = 46;
  for(let i=0;i<n;i++){
    dust.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*2.2 + 0.6,
      vx: (Math.random()-0.5)*0.12,
      vy: -(Math.random()*0.18 + 0.03),
      a: Math.random()*0.25 + 0.05
    });
  }
}

/* --- moon state (revealed in Scene 2) --- */
const moon = {
  visible:false,
  t:0,            // 0..1 reveal progress
  cx:0, cy:0, R:0
};
function placeMoon(){
  moon.cx = W*0.5;
  moon.cy = H*0.40;
  moon.R  = Math.min(W,H)*0.17;
}

/* --- fog blobs drifting across the moon --- */
let fog = [];
function buildFog(){
  fog = [];
  for(let i=0;i<6;i++){
    fog.push({
      x: Math.random()*W,
      y: H*0.30 + Math.random()*H*0.25,
      r: Math.min(W,H)*(0.18+Math.random()*0.22),
      vx: (Math.random()*0.18+0.05)*(Math.random()<0.5?-1:1),
      a: Math.random()*0.05 + 0.02
    });
  }
}

let tPrev = performance.now();
function frame(now){
  const dt = Math.min(40, now - tPrev); tPrev = now;
  ctx.clearRect(0,0,W,H);

  /* deep gradient wash so canvas blends with frame */
  const g = ctx.createRadialGradient(W*0.5,H*0.42,0, W*0.5,H*0.5,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(20,35,63,0.35)');
  g.addColorStop(1,'rgba(7,15,28,0.0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  /* stars */
  for(const s of stars){
    s.tw += s.tws * dt * 0.004;
    s.y  += s.drift * dt * 0.06;
    if(s.y > H+2){ s.y = -2; s.x = Math.random()*W; }
    const a = s.base + Math.sin(s.tw)*0.25;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = '#dfe7f5';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* moon */
  if(moon.visible){
    moon.t = Math.min(1, moon.t + dt*0.00035);
    const ease = 1 - Math.pow(1-moon.t, 3);
    const R = moon.R;
    const cx = moon.cx, cy = moon.cy;

    /* bloom halo */
    const halo = ctx.createRadialGradient(cx,cy,R*0.4, cx,cy,R*3.4);
    halo.addColorStop(0, 'rgba(180,200,235,'+(0.30*ease)+')');
    halo.addColorStop(0.4,'rgba(150,175,215,'+(0.10*ease)+')');
    halo.addColorStop(1, 'rgba(150,175,215,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0,0,W,H);

    /* moon disc */
    const disc = ctx.createRadialGradient(cx-R*0.3, cy-R*0.3, R*0.1, cx, cy, R);
    disc.addColorStop(0, 'rgba(238,240,246,'+(0.95*ease)+')');
    disc.addColorStop(0.7,'rgba(205,213,228,'+(0.9*ease)+')');
    disc.addColorStop(1, 'rgba(150,165,195,'+(0.85*ease)+')');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fill();

    /* craters — subtle */
    /* irregular maria — scattered off-centre so it reads as a moon, not a face */
    const craters = [[-.34,-.06,.15],[-.12,-.36,.07],[.30,.22,.12],[.43,-.20,.05],[-.26,.30,.08],[.10,.40,.05]];
    for(const c of craters){
      const mg = ctx.createRadialGradient(cx+c[0]*R, cy+c[1]*R, 0, cx+c[0]*R, cy+c[1]*R, c[2]*R);
      mg.addColorStop(0, 'rgba(120,132,158,'+(0.13*ease)+')');
      mg.addColorStop(1, 'rgba(120,132,158,0)');
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(cx+c[0]*R, cy+c[1]*R, c[2]*R, 0, Math.PI*2);
      ctx.fill();
    }

    /* fog drifting over the moon */
    for(const f of fog){
      f.x += f.vx * dt * 0.06;
      if(f.x < -f.r) f.x = W+f.r;
      if(f.x > W+f.r) f.x = -f.r;
      const fg = ctx.createRadialGradient(f.x,f.y,0, f.x,f.y,f.r);
      fg.addColorStop(0,'rgba(40,58,92,'+(f.a*ease)+')');
      fg.addColorStop(1,'rgba(40,58,92,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  /* foreground dust */
  for(const d of dust){
    d.x += d.vx * dt * 0.06;
    d.y += d.vy * dt * 0.06;
    if(d.y < -4){ d.y = H+4; d.x = Math.random()*W; }
    if(d.x < -4) d.x = W+4; if(d.x > W+4) d.x = -4;
    ctx.globalAlpha = d.a;
    ctx.fillStyle = '#aebfe0';
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

/* =========================================================
   TIMELINE / DIRECTOR
   ========================================================= */
const labelCard = document.getElementById('labelCard');
const lines = labelCard.querySelectorAll('.line');
const identityCard = document.getElementById('identityCard');
const nameH = document.getElementById('nameH');
const roleP = document.getElementById('roleP');
const teaserCard = document.getElementById('teaserCard');
const stats = teaserCard.querySelectorAll('.stat');
const scrollCard = document.getElementById('scrollCard');
const flicker = document.getElementById('flicker');

/* Master pacing knob. 1 = full cinematic (~28s). Raise to compress:
   1.5 ≈ 19s, 1.9 ≈ 15s. Lower (<1) to slow it down further. */
const SPEED = 1;
const wait = ms => new Promise(r=>setTimeout(r, ms / SPEED));

function reelFlicker(){
  flicker.style.transition='opacity .05s';
  flicker.style.opacity='.55';
  setTimeout(()=>{ flicker.style.opacity='0'; },55);
}

async function direct(){
  /* boot */
  await wait(2600);

  /* ---- SCENE 1 : typewriter title cards ---- */
  labelCard.style.opacity = 1;
  const beats = [1700, 1700, 2000, 1700, 1900]; // hold per line
  for(let i=0;i<lines.length;i++){
    lines[i].classList.add('show');
    await wait(beats[i]);
  }
  await wait(900);

  /* fade scene 1 out */
  lines.forEach(l=>{ l.classList.remove('show'); l.classList.add('out'); });
  await wait(1500);
  labelCard.style.opacity = 0;

  /* ---- SCENE 2 : the moon emerges ---- */
  reelFlicker();
  moon.visible = true;
  await wait(3200);          // let it rise through the fog

  /* ---- SCENE 3 : the name (earned) ---- */
  reelFlicker();
  identityCard.classList.add('reveal');
  nameH.classList.add('show');
  await wait(2600);

  /* ---- SCENE 4 : the role ---- */
  roleP.classList.add('show');
  await wait(2600);

  /* ---- SCENE 5 : teaser stats ---- */
  /* lift the name/role group up & dim it to make room */
  identityCard.classList.add('recede');
  await wait(900);
  teaserCard.style.opacity = 1;
  for(let i=0;i<stats.length;i++){
    stats[i].classList.add('show');
    await wait(1700);
  }
  await wait(1200);

  /* ---- FINAL : scroll prompt ---- */
  scrollCard.style.opacity = 1;
  scrollCard.classList.add('show');
}

/* boot */
resize();
placeMoon();
buildDust();
buildFog();
window.addEventListener('resize', ()=>{ placeMoon(); buildDust(); buildFog(); });
requestAnimationFrame(frame);
direct();
</script>
</body>
</html>
